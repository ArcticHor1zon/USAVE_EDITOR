# =============================================================================
# ULTRAKILL weapon definitions
# =============================================================================
#
# Maps weapon types -> unlockable variants -> save file field names.
#
# To add a new weapon variant when ULTRAKILL updates:
#   1. Find the weapon type it belongs to (e.g. "Revolver").
#   2. Add a new entry under its `variants:` list:
#
#        - name: "Cool New Revolver"
#          field: "rev4"           # the field name in generalprogress.bepis
#                                   # (look this up in the game's decompiled
#                                   # source or by inspecting a save file)
#
#   3. Save and restart the editor.
#
# Field naming convention used by the game:
#   rev*   = revolver
#   sho*   = shotgun
#   nai*   = nailgun
#   rai*   = railgun
#   rock*  = rocket launcher
#   arm*   = arm (Knuckleblaster, Whiplash, etc.)
#   beam*  = revolver beam color (cosmetic)
#
# The `customization_field` is the bool field that gates whether the
# weapon's customization menu is unlocked. Set to null if not applicable
# (e.g. for the Arm, which has no customization).
# =============================================================================

weapon_types:
  - name: "Revolver"
    customization_field: "revCustomizationUnlocked"
    variants:
      - { name: "Piercer Revolver",       field: "rev0" }
      - { name: "Marksman Revolver",      field: "rev1" }
      - { name: "Sharpshooter Revolver",  field: "rev2" }
      - { name: "Alternate Revolver",     field: "revalt" }

  - name: "Shotgun"
    customization_field: "shoCustomizationUnlocked"
    variants:
      - { name: "Core Eject Shotgun",     field: "sho0" }
      - { name: "Pump Charge Shotgun",    field: "sho1" }
      - { name: "Sawed-On Shotgun",       field: "sho2" }
      - { name: "Jackhammer",             field: "shoalt" }

  - name: "Nailgun"
    customization_field: "naiCustomizationUnlocked"
    variants:
      - { name: "Attractor Nailgun",      field: "nai0" }
      - { name: "Overheat Nailgun",       field: "nai1" }
      - { name: "Jumpstart Nailgun",      field: "nai2" }
      - { name: "Sawblade Launcher",      field: "naialt" }

  - name: "Railgun"
    customization_field: "raiCustomizationUnlocked"
    variants:
      - { name: "Electric Railgun",       field: "rai0" }
      - { name: "Malicious Railgun",      field: "rai1" }
      - { name: "Screwdriver Railgun",    field: "rai2" }

  - name: "Rocket Launcher"
    customization_field: "rockCustomizationUnlocked"
    variants:
      - { name: "Freezeframe Rocket Launcher",   field: "rock0" }
      - { name: "S.R.S. Cannon Rocket Launcher", field: "rock1" }
      - { name: "Firestarter Rocket Launcher",   field: "rock2" }

  - name: "Arm"
    customization_field: null     # Arm has no customization menu
    variants:
      - { name: "Knuckleblaster",  field: "arm1" }
      - { name: "Whiplash",        field: "arm2" }
