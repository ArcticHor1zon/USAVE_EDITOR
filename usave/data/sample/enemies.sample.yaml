# =============================================================================
# SAMPLE enemies.yaml — reference template with every option documented.
# =============================================================================
#
# The `id` is the index into the `newEnemiesFound` int[] array in
# generalprogress.bepis. The `name` is shown in the GUI.
#
# FIELD REFERENCE
# ---------------
#
# Per enemy entry (under top-level `enemies:` list):
#
#   id:    REQUIRED. Integer. Positional index into the
#          `newEnemiesFound` array. Starts at 0. Must be sequential
#          and unique. Do NOT reorder existing entries or change
#          their ids — that will misalign the save file's enemy
#          discovery array.
#
#   name:  REQUIRED. String. Display name shown in the GUI under the
#          Enemies section. Use the in-game enemy name.
#
# To add a new enemy when ULTRAKILL updates:
#   1. Find the next free `id` (count up from the last entry).
#   2. Add a new entry (compact form is fine):
#        - { id: 44, name: "Cool New Enemy" }
#   3. Save and restart the editor.
#
# To add a new field in the future (e.g. an enemy icon path), add it
# as an optional field here and update schema.py to read it with a
# default value.
#
# IMPORTANT: do NOT change existing `id` values — they are positional.
# =============================================================================

enemies:
  # First entry — long-form syntax showing all fields:
  - id: 0
    name: "Cerberus"
  # Subsequent entries — compact short-form syntax:
  - { id: 1,  name: "Drone" }
