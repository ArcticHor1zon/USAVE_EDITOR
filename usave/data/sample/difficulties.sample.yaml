# =============================================================================
# SAMPLE difficulties.yaml — reference template with every option documented.
# =============================================================================
#
# The 5 difficulties ULTRAKILL ships with. The `id` is used in two places:
#   1. The filename: difficulty<id>progress.bepis
#   2. The array index into the Cybergrind per-difficulty stat arrays
#      (preciseWavesByDifficulty, bestKillsByDifficulty, etc.) in
#      endlessprogress.bepis.
#
# FIELD REFERENCE
# ---------------
#
# Per difficulty entry (under top-level `difficulties:` list):
#
#   id:    REQUIRED. Integer. Positional index. Starts at 0. Must be
#          sequential and unique. Do NOT reorder existing entries or
#          change their ids — that will misalign the Cybergrind stat
#          arrays and break difficulty<N>progress.bepis filenames.
#
#   name:  REQUIRED. String. Display name shown in the difficulty
#          dropdown in the top bar.
#
# To add a new difficulty (rare — ULTRAKILL would have to add one):
#   1. Add an entry with the next free `id`:
#        - { id: 5, name: "ULTRAKILL MUST DIE" }
#   2. Save and restart the editor.
#
# IMPORTANT: do NOT change existing `id` values.
# =============================================================================

difficulties:
  # First entry — long-form syntax showing all fields:
  - id: 0
    name: "Harmless"
  # Subsequent entries — compact short-form syntax:
  - { id: 1, name: "Lenient" }
  - { id: 2, name: "Standard" }   # default difficulty when the editor opens
  - { id: 3, name: "Violent" }
  - { id: 4, name: "Brutal" }
  # When a new difficulty is added by an ULTRAKILL update:
  # - { id: 5, name: "ULTRAKILL MUST DIE" }
