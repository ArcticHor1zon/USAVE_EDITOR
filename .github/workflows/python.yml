name: Python CI

on:
  push:
    branches: [python, master]
  pull_request:
    branches: [python, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest tests/ -v

      - name: Verify imports
        run: |
          python -c "from usave.data.schema import GAME_DATA; print(f'Loaded {len(list(GAME_DATA.iter_all_levels()))} levels')"
          python -c "from usave.nrbf import Stream, Class, Primitive, PrimitiveArray, PrimitiveType; print('NRBF library OK')"
